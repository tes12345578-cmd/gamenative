{"name":"Build APK","on":"workflow_dispatch","jobs":{"build":{"runs-on":"ubuntu-24.04","steps":[{"uses":"actions/checkout@v4","with":{"lfs":true,"submodules":"true"}},{"uses":"actions/setup-java@v5","with":{"distribution":"temurin","java-version":"17"}},{"name":"Build","run":"echo \"sdk.dir=$ANDROID_HOME\" > local.properties\necho \"\" >> gradle.properties\necho \"org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\" >> gradle.properties\necho \"kotlin.daemon.jvmargs=-Xmx4g\" >> gradle.properties\ngrep -rl 'name=\"app_name\"' app/src/main/res | xargs sed -i -E 's#(<string name=\"app_name\"[^>]*>)[^<]*</string>#\\1DragonPotato</string>#'\nR=app/src/main/res\nif [ -f custom/foto.png ]; then\nmkdir -p $R/drawable-nodpi\nconvert custom/foto.png -resize 340x340^ -gravity center -extent 340x340 -background none -extent 512x512 $R/drawable-nodpi/dp_icon.png\nW=$(identify -format %w $R/drawable-hdpi/wallpaper.png)\nH=$(identify -format %h $R/drawable-hdpi/wallpaper.png)\nconvert custom/foto.png -resize ${W}x${H}^ -gravity center -extent ${W}x${H} $R/drawable-hdpi/wallpaper.png\nfor f in $R/mipmap-anydpi-v26/ic_launcher*.xml; do echo '<?xml version=\"1.0\" encoding=\"utf-8\"?><adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\"><background android:drawable=\"#000000\"/><foreground android:drawable=\"@drawable/dp_icon\"/></adaptive-icon>' > $f; done\nfi\nchmod +x gradlew\n./gradlew assembleModernDebug --no-daemon"},{"uses":"actions/upload-artifact@v4","with":{"name":"DragonPotato-apk","path":"**/build/outputs/apk/**/*.apk"}}]}}}
